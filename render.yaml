services:
  - type: web
    name: lifeos-ai-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lifeos-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://lifeos-aiproject.vercel.app,http://localhost:3000
      - key: PYTHON_VERSION
        value: 3.12.0
      # Fill these in the Render dashboard after deploy:
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://lifeos-ai-api.onrender.com/api/auth/google/callback
- key: FRONTEND_URL
  value: https://lifeos-aiproject.vercel.app

databases:
  - name: lifeos-ai-db
    plan: free
    region: oregon
