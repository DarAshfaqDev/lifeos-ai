services:
  - type: web
    name: lifeos-ai-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lifeos-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://lifeos-ai.vercel.app,http://localhost:3000
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: lifeos-ai-db
    plan: free
    region: oregon
